[project]
name = "zoo-simulator"
version = "0.1.0"
description = "A simple ecosystem simulation with herbivores, omnivores, and carnivores."
authors = [
    { name = "Gabriela Gonzalez" }
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
zoo-sim = "zoo_simulator.main:cli"